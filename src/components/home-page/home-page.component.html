<app-header [currentSectionToChild]="currentSection"></app-header>
<!-- Sections -->
<section id="home" class="hero-section text-white" style="position: relative;">
  <div class="d-none d-lg-block">
  <owl-carousel-o [options]="customOptions">
    @for (testimonial of testimonials; track $index) {
    <ng-template carouselSlide>
      <div class="carousel-slide-wrapper">
        <img [src]="testimonial.image" alt="home" class="carousel-image" />
        
      </div>
    </ng-template>
    }
  </owl-carousel-o>
  </div>
  <div class="d-lg-none" style="margin-top: 30%;">
  <owl-carousel-o [options]="customOptions">
    @for (testimonial of testimonials; track $index) {
      <ng-template carouselSlide>
        <div class="testimonial-card">
          <img [src]="testimonial.image" alt="img" />

        </div>
      </ng-template>
    }
  </owl-carousel-o>
  </div>


  <div class="scroll-down mt-5 text-center">
    
    <a (click)="scroll('course')" class="btn btn-warning btn-lg mt-4 px-4 py-2 glow-btn" style="z-index: 999 !important;
    position: relative;
    margin-bottom: 15px;">Explore Courses</a><br>
    <span class="mouse"></span>
  </div>

</section>
